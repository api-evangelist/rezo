name: Rezo
description: >-
  Rezo.ai is an enterprise customer-experience (CX) company building a unified,
  agentic-AI contact-center platform. Founded in 2018 in Noida, India by Dr. Rashi
  Gupta and Dr. Manish Gupta, Rezo automates and augments customer interactions
  across voice, chat, email, and social channels with AI voice agents, speech and
  sentiment analytics, real-time agent assist, and robotic process automation,
  supporting 30+ languages. Its Agentic AI Suite spans customer support, sales, and
  marketing use cases for enterprises across banking, telecom, e-commerce, and other
  verticals, with product surfaces including the "Central Data Hub" (my.rezo.ai) and
  the "Autonomous Conversation Matrix" (az-converse.rezo.ai). Rezo operates offices in
  India, the USA, and the UAE, and holds ISO 27701:2019 with GDPR compliance. Rezo does
  not currently publish a public API, developer portal, SDKs, or OpenAPI specification;
  this profile captures its public identity, trust/compliance posture, and vulnerability
  disclosure program.
